repos:
  - repo: local
    hooks:
      - id: lint
        name: make lint
        entry: make lint
        language: system
        pass_filenames: false
      - id: typecheck
        name: make typecheck
        entry: make typecheck
        language: system
        pass_filenames: false
      - id: format
        name: make format
        entry: make format
        language: system
        pass_filenames: false
      # Run at commit stage — must be fast
      - id: pytest-unit
        name: pytest (unit)
        entry: uv run pytest tests/unit/ -x -q
        language: system
        pass_filenames: false
        files: ^(tests/unit/|src/lies/)
        stages: [commit]

      # Run at pre-push stage — integration tests touch git/filesystem
      - id: pytest-integration
        name: pytest (integration)
        entry: uv run pytest tests/integration/ -x -q
        language: system
        pass_filenames: false
        files: ^(tests/integration/|src/lies/)
        stages: [pre-push]
