repos:
  # Pydantic-guidance (PG) + PYD lint. The plugin is vendored under
  # `vendor/pydantic-guidance/` and installed as an editable path dep
  # (`pyproject.toml` → `[tool.uv.sources] pydantic-guidance`). `uv sync`
  # builds + installs the plugin into the project venv so `flake8` picks
  # it up via the flake8 entry-point. The local hook below calls
  # `uv run flake8 --select=PG,PYD` so pre-commit uses the project's
  # already-installed flake8 + plugin (no upstream clone needed).
  - repo: local
    hooks:
      - id: pydantic-guidance
        name: pydantic-guidance (PG) + flake8-pydantic (PYD)
        # PG101 (BaseModel uses no Pydantic surface) is an opt-in
        # advisory that flake8 still fires under --select=PG (prefix
        # match). Hold it back from the commit-time surface — the
        # PG101.md rule definition itself recommends per-line
        # `# noqa: PG101` only when the user opts in via
        # `--extend-select=PG101`.
        # `--exclude` is required because flake8's default exclude
        # patterns are skipped when flake8 is invoked from a
        # pre-commit hook with `types_or: [python, pyi]` (every
        # Python file is staged, including `.venv/.../site-packages`).
        entry: uv run flake8 --select=PG,PYD --extend-ignore=PG101 --exclude=.venv,build,dist,node_modules
        language: system
        types_or: [python, pyi]
        pass_filenames: false

  # Pinned to v0.14.14 because ruff 0.15+ strips the mandatory
  # parens around multi-exception ``except`` clauses (upstream
  # issue #26449), reverting them to Python 2 ``except X, Y:``
  # syntax that fails at import time. The pin matches the
  # ``ruff<0.15`` upper bound in ``pyproject.toml``.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^((src/lies|tests|scripts)/|pyproject\.toml$)
      - id: ruff-format
        files: ^((src/lies|tests|scripts)/|pyproject\.toml$)
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.66
    hooks:
      - id: ty
        # `--frozen` is a `uv` global flag passed to `uv check` so the hook
        # does not auto-regenerate `uv.lock` on every commit (a stale lock
        # would otherwise be silently rewritten, masking version bumps).
        args: ["--frozen"]
  - repo: local
    hooks:
      - id: test
        name: make unit-test
        # Strip pre-commit's GIT_DIR / GIT_INDEX_FILE so git's upward
        # auto-discovery works inside test fixtures that init their own
        # repos in tmp dirs. Without this, `git rev-parse --show-toplevel`
        # in those fixtures returns the cwd instead of walking up.
        entry: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE -u GIT_COMMON_DIR uv run make unit-test
        language: system
        pass_filenames: false
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: no-co-authored-by
        name: forbid Co-Authored-By trailer
        # bash -c 'script' FILE treats FILE as $0 (it is the first arg after
        # the script). pre-commit passes the commit message filename as the
        # sole positional argument, so $0 is the message file and $1 is
        # empty. grep on $0 rejects any Co-Authored-By trailer.
        entry: bash -c '! grep -iE "^Co-Author[^:]*:" "$0" >/dev/null'
        language: system
        stages: [commit-msg]
        always_run: true
