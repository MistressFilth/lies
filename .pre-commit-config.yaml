repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^((src/lies|tests|scripts)/|pyproject\.toml$)
      - id: ruff-format
        files: ^((src/lies|tests|scripts)/|pyproject\.toml$)
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.66
    hooks:
      - id: ty
  - repo: local
    hooks:
      - id: test
        name: make test
        entry: uv run make test
        language: system
        pass_filenames: false
        stages: [pre-commit]
