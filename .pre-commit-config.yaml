repos:
  # Pydantic-guidance (PG) + PYD lint. The hook ships flake8 with the
  # upstream `pydantic-guidance` plugin and `flake8-pydantic` as
  # `additional_dependencies`, so no prior `uv add` is needed when running
  # pre-commit. For local Makefile runs, both packages are listed under
  # `[project.optional-dependencies] dev` in `pyproject.toml`.
  - repo: https://github.com/MistressFilth/pydantic-guidance
    # Pinned to a commit SHA because the upstream `v0.1.1` tag referenced
    # in the repo's own README + pyproject.toml hasn't been pushed yet
    # (`git ls-remote --tags` returns empty). Bump to a real tag (or a
    # newer SHA) once upstream publishes one; mirror the same ref in
    # `[tool.uv.sources] pydantic-guidance.rev` in `pyproject.toml`.
    rev: d7d992b3b5897321a92fb21b1ad6f35f49b35fa5
    hooks:
      - id: pydantic-guidance
        # Override the upstream entry: flake8's `--select=PG` is a prefix
        # match that would also pull in the opt-in advisory `PG101`
        # (`BaseModel` uses no Pydantic surface). PG101 produces high
        # false-positive rates in this repo because sub-agent message
        # models are dataclass-shaped by design. The default-on PG codes
        # (PG001-003) cover real Pydantic-usage guidance; PG101 lives
        # behind `make lint-pg101` / `make check-strict` for opt-in
        # review.
        entry: flake8 --select=PG001,PG002,PG003,PYD
        # Mirror the file scope used by ruff + ty so the lint surface stays
        # consistent across hooks. Without this, pre-commit defaults to
        # `types_or: [python, pyi]` which is also fine — the explicit
        # `files:` regex keeps scope aligned with `src/`, `tests/`, and
        # `scripts/`.
        files: ^((src/lies|tests|scripts)/.*\.(py|pyi)|pyproject\.toml)$

  # Pinned to v0.14.14 because ruff 0.15+ strips the mandatory
  # parens around multi-exception ``except`` clauses (upstream
  # issue #26449), reverting them to Python 2 ``except X, Y:``
  # syntax that fails at import time. The pin matches the
  # ``ruff<0.15`` upper bound in ``pyproject.toml``.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^((src/lies|tests|scripts)/|pyproject\.toml$)
      - id: ruff-format
        files: ^((src/lies|tests|scripts)/|pyproject\.toml$)
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.66
    hooks:
      - id: ty
        # `--frozen` is a `uv` global flag passed to `uv check` so the hook
        # does not auto-regenerate `uv.lock` on every commit (a stale lock
        # would otherwise be silently rewritten, masking version bumps).
        args: ["--frozen"]
  - repo: local
    hooks:
      - id: test
        name: make unit-test
        # Strip pre-commit's GIT_DIR / GIT_INDEX_FILE so git's upward
        # auto-discovery works inside test fixtures that init their own
        # repos in tmp dirs. Without this, `git rev-parse --show-toplevel`
        # in those fixtures returns the cwd instead of walking up.
        entry: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE -u GIT_COMMON_DIR uv run make unit-test
        language: system
        pass_filenames: false
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: no-co-authored-by
        name: forbid Co-Authored-By trailer
        # bash -c 'script' FILE treats FILE as $0 (it is the first arg after
        # the script). pre-commit passes the commit message filename as the
        # sole positional argument, so $0 is the message file and $1 is
        # empty. grep on $0 rejects any Co-Authored-By trailer.
        entry: bash -c '! grep -iE "^Co-Author[^:]*:" "$0" >/dev/null'
        language: system
        stages: [commit-msg]
        always_run: true
