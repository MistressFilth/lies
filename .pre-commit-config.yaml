repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^((src/lies|tests|scripts|tools)/|pyproject\.toml$)
      - id: ruff-format
        files: ^((src/lies|tests|scripts|tools)/|pyproject\.toml$)
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.84
    hooks:
      - id: ty
        args: ["--frozen"]
  - repo: https://github.com/MistressFilth/supyrliminal
    rev: v0.1.0
    hooks:
      - id: supyrliminal
        files: ^((src/lies|tests|scripts|tools)/|pyproject\.toml$)
  - repo: local
    hooks:
      - id: test
        name: make unit-test
        entry: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE -u GIT_COMMON_DIR uv run make unit-test
        language: system
        pass_filenames: false
        exclude: ^uv\.lock$
        stages: [pre-commit]
      - id: lies-commands-exist
        name: "lies mcp orientation: lies <cmd> references resolve"
        entry: uv run python tools/check_lies_commands.py
        language: system
        files: '^(src/lies/mcp/instructions\.md|src/lies/mcp/prompts/.*\.md)$'
        pass_filenames: false
        stages: [pre-commit]
