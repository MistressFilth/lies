name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0facbc364238e5cd8370b5f9717b07302a3f59
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69de4e07de1c11a8b91a4a46a39e3e5b2c3
        with:
          python-version: "3.11"
      - run: uv sync --all-extras
      - run: make check
      - run: git diff --exit-code
      - run: make test
