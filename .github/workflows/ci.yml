name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: uv sync --all-extras
      - run: make check
      - run: git diff --exit-code
      - run: make test
