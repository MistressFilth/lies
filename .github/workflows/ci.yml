name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: uv sync --all-extras
      # Pre-commit: hard-limit gate runs locally on a fixed runner
      # (the pre-commit hook fails the commit on any >0.15s regression).
      - run: uv run pre-commit run --all-files
      # CI test suite: runs the FULL test surface. The unit gate is
      # disabled via ``CI=true`` (see tests/unit/conftest.py); slow and
      # integration tests run together via ``--runslow INTEGRATION=1``.
      - name: Run full test suite (unit + integration, all slow tests included)
        run: uv run pytest tests/ --runslow --tb=short -q -p no:cacheprovider
        env:
          INTEGRATION: "1"
          CI: "true"

