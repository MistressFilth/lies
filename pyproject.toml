[project]
name = "lies"
version = "0.4.0"
description = "Library of Inconsistent Explanations & Sources — a Karpathy-pattern LLM wiki."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic-ai-slim>=2.18",
    "pydantic-ai-harness[code-mode,dynamic-workflow]",
    "typer>=0.12",
    "logfire",
    "pyyaml",
    "python-frontmatter",
    "pymupdf>=1.24",
    "pdfplumber>=0.10",
    "pydantic>=2.0",
    "fastmcp>=2.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "ty>=0.0.65",
]
# `qmd` is now an empty extra retained for back-compat. `fastmcp` and `mcp`
# are default dependencies as of the MCP server release. Install with
# `uv sync --extra qmd` continues to work but adds nothing on top of defaults.
qmd = []

[project.scripts]
lies = "lies.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/lies"]