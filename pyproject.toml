[project]
name = "lies"
version = "0.18.0"
description = "Library of Inconsistent Explanations & Sources — a Karpathy-pattern LLM wiki."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "pydantic-ai-slim[openai]>=2.18",
    "pydantic-ai-harness[code-mode,dynamic-workflow]",
    "typer>=0.12",
    "logfire",
    "pyyaml",
    "python-frontmatter",
    "pymupdf>=1.24",
    "pdfplumber>=0.10",
    "pydantic>=2.0",
    "fastmcp>=2.0",
    "mcp>=1.0",
    "ahocorasick_rs>=1.0,<2.0",
    # Vendored flake8 plugin — see ./vendor/pydantic-guidance. Pinned to
    # a path dep rather than `[tool.uv.sources] pydantic-guidance` because
    # the upstream is a private GitHub repo and `uv sync` cannot clone it
    # without credentials (the CI runner has none). Vendoring makes the
    # lint installable on every machine that has the lies repo checked out.
    "pydantic-guidance",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.5,<0.15",
    "ty>=0.0.65",
]
# `qmd` is now an empty extra retained for back-compat. `fastmcp` and `mcp`
# are default dependencies as of the MCP server release. Install with
# `uv sync --extra qmd` continues to work but adds nothing on top of defaults.
qmd = []

[project.scripts]
lies = "lies.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
markers = [
    "integration: end-to-end tests that exercise git and filesystem boundaries",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src/lies"]

[dependency-groups]
dev = [
    "identify>=2.6.19",
    "pre-commit>=4.6.1",
    "flake8>=5.0",
    "flake8-pydantic>=0.4",
]

[tool.uv.sources]
pydantic-guidance = { path = "vendor/pydantic-guidance", editable = true }
