[project]
name = "lies"
version = "0.48.1"
description = "Library of Inconsistent Explanations & Sources — a Karpathy-pattern LLM wiki."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "pydantic-ai-slim[openai]>=2.18",
    "pydantic-ai-harness[code-mode,dynamic-workflow]",
    "typer>=0.12",
    "logfire",
    "pyyaml",
    "python-frontmatter",
    "pymupdf>=1.24",
    "pdfplumber>=0.10",
    "pydantic>=2.0",
    # 4.x, not 2.x: `Client.call_tool(..., raise_on_error=False)` is
    # keyword-only on 4.0 and absent on 2.x, and `access.py` calls it on
    # every daemon call. A `>=2.0` floor advertised compatibility the code
    # does not have — a 2.x install dies with a TypeError at the first
    # qmd call, not at import. 4 also supplies
    # `fastmcp.server.transforms.PromptsAsTools`, which server.py imports
    # directly (PR #115). Note fastmcp 4 vendors its own httpx as
    # `httpx2`, which is why `classify_call_error` matches exception
    # class *names* rather than httpx types.
    "fastmcp>=4.0",
    "mcp>=1.0",
    "ahocorasick_rs>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.16.10",
    "ty>=0.0.84",
    "supyrliminal>=0.1.0",
]
# `qmd` is now an empty extra retained for back-compat. `fastmcp` and `mcp`
# are default dependencies as of the MCP server release. Install with
# `uv sync --extra qmd` continues to work but adds nothing on top of defaults.
qmd = []

[project.scripts]
lies = "lies.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
markers = [
    "integration: end-to-end tests that exercise git and filesystem boundaries",
    "slow: tests over the 0.15s wall-clock budget (opt-in via --runslow)",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Pinned explicitly because ruff 0.16 widened its *default* rule set
# from the classic E4/E7/E9/F to effectively everything. Taking the new
# version under the new default means silently inheriting 77 new style
# opinions (BLE001, PLW1510, S110, B008, DTZ, ...) across code that was
# written against the old one. This is the same enforcement the repo
# actually had, on the newer tool.
select = ["E4", "E7", "E9", "F"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src/lies"]

[dependency-groups]
dev = [
    "identify>=2.6.19",
    "pre-commit>=4.6.1",
    "supyrliminal>=0.1.0",
]

[tool.uv.sources]
supyrliminal = { git = "https://github.com/MistressFilth/supyrliminal.git", rev = "v0.1.0" }
