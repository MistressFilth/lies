[project]
name = "lies"
version = "0.1.0"
description = "Library of Inconsistent Explanations & Sources — a Karpathy-pattern LLM wiki."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic-ai-slim>=2.18",
    "pydantic-ai-harness[code-mode,dynamic-workflow]",
    "typer>=0.12",
    "logfire",
    "pyyaml",
    "python-frontmatter",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",  # for mocking HTTP in tests
]
# `qmd` enables the qmd MCP stdio transport (https://github.com/tobi/qmd#mcp).
# The default LIES install does not need this: the MCP client constructs
# without these deps and only fails on the first tool call. Install this
# extra to enable agent-native hybrid search at runtime:
#   uv pip install "lies[qmd]"
#   # or:
#   uv sync --extra qmd
qmd = [
    "fastmcp>=2.0",
    "mcp>=1.0",
]

[project.scripts]
lies = "lies.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/lies"]