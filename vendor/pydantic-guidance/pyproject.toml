[project]
name = "pydantic-guidance"
description = "Boundary-aware Pydantic-guidance linter (PG) for flake8"
version = "0.1.1"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0", "flake8>=5.0", "flake8-pydantic>=0.4"]

[project.scripts]
flake8 = "flake8.main.cli:main"

[project.entry-points."flake8.extension"]
PG = "pydantic_guidance.flake8_guidance:PGPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pydantic_guidance"]
include = ["pydantic_guidance/_rules/*.md"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "behave>=1.2",
    "mypy>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
