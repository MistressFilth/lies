repos:
  - repo: https://github.com/Aledade-Sandbox/pydantic-guidance
    rev: v0.1.1
    hooks:
      # Pydantic-guidance (PG) and PYD checks together.
      - id: pydantic-guidance

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
